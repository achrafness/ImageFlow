name: Build executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm ImageFlow.spec
      - name: Package
        shell: bash
        run: |
          mkdir release
          case "${{ runner.os }}" in
            Windows) cp dist/ImageFlow.exe release/ImageFlow-windows.exe ;;
            macOS)   ditto -c -k --keepParent dist/ImageFlow.app release/ImageFlow-macos.zip ;;
            Linux)   tar -czf release/ImageFlow-linux.tar.gz -C dist ImageFlow ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ImageFlow-${{ runner.os }}
          path: release/

  release:
    # Publishes a GitHub release when a version tag (v1.0.0, ...) is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
